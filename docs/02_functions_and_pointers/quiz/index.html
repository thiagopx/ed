<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz — Funções e ponteiros em C</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 30px 15px;
  }

  .quiz-card {
    max-width: 700px;
    margin: 0 auto;
    background-color: #ffffff;
    border: 1px solid #0984e3;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(9, 132, 227, 0.08);
    padding: 30px;
    line-height: 1.6;
    color: #333;
  }

  .quiz-header {
    border-bottom: 2px solid #0984e3;
    padding-bottom: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-header h2 {
    color: #2c3e50;
    margin: 0;
    font-size: 1.25em;
  }

  .quiz-tag {
    background-color: #0984e3;
    color: white;
    padding: 5px 12px;
    font-size: 0.85em;
    font-weight: bold;
    border-radius: 20px;
    white-space: nowrap;
  }

  .progress-bar-track {
    width: 100%;
    height: 6px;
    background-color: #eef2f5;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar-fill {
    height: 100%;
    background-color: #0984e3;
    width: 10%;
    transition: width 0.25s ease;
  }

  .question-block {
    background-color: #fdfdfd;
    border: 1px solid #e0e0e0;
    border-left: 5px solid #0984e3;
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 20px;
    transition: border-left-color 0.2s ease;
  }

  .badges {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .q-label {
    display: inline-block;
    background: #0984e3;
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.75em;
  }

  .diff-label {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75em;
    font-weight: bold;
  }
  .diff-basico     { background: #d4efdf; color: #1e8449; }
  .diff-intermediario { background: #fdebd0; color: #b9770e; }
  .diff-avancado   { background: #fadbd8; color: #a93226; }

  .q-text {
    font-size: 1em;
    color: #2c3e50;
    margin: 6px 0 14px 0;
  }

  pre.code-block {
    background-color: #2d3436;
    color: #dfe6e9;
    padding: 14px 16px;
    border-radius: 6px;
    font-family: 'Fira Code', Consolas, Monaco, monospace;
    font-size: 0.9em;
    overflow-x: auto;
    margin: 10px 0 4px 0;
  }
  pre.code-block .kw   { color: #74b9ff; }
  pre.code-block .type { color: #55efc4; }
  pre.code-block .str  { color: #ffeaa7; }
  pre.code-block .cmt  { color: #95a5a6; font-style: italic; }

  .options {
    list-style: none;
    padding: 0;
    margin: 16px 0 0 0;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
    border: 1px solid #dcdde1;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95em;
    color: #2c3e50;
    background-color: #fff;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .option:hover {
    border-color: #0984e3;
    background-color: #f0f8ff;
  }

  .option.selected {
    border-color: #0984e3;
    background-color: #eaf4fd;
  }

  .option .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 50%;
    border: 1px solid #b2bec3;
    font-size: 0.8em;
    font-weight: bold;
    color: #636e72;
  }

  .option.selected .letter {
    border-color: #0984e3;
    background-color: #0984e3;
    color: #fff;
  }

  .option.correct {
    border-color: #00b894;
    background-color: #e8f8f5;
  }
  .option.correct .letter {
    border-color: #00b894;
    background-color: #00b894;
    color: #fff;
  }

  .option.incorrect {
    border-color: #d63031;
    background-color: #fdecea;
  }
  .option.incorrect .letter {
    border-color: #d63031;
    background-color: #d63031;
    color: #fff;
  }

  .option.disabled {
    cursor: default;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .btn-primary {
    background-color: #0984e3;
    color: #fff;
  }
  .btn-primary:disabled {
    background-color: #b2cdf0;
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: #f1f2f6;
    color: #2c3e50;
    border: 1px solid #dcdde1;
  }
  .btn-secondary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .feedback {
    display: none;
    margin-top: 18px;
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 0.92em;
  }

  .feedback.show { display: block; }

  .feedback.correct-box {
    background-color: #e8f8f5;
    border: 1px solid #a3e4d7;
    color: #117a65;
  }

  .feedback.incorrect-box {
    background-color: #fdecea;
    border: 1px solid #f5b7b1;
    color: #922b21;
  }

  .feedback strong.title {
    display: block;
    margin-bottom: 6px;
    font-size: 1.02em;
  }

  .feedback .explain {
    color: #2c3e50;
  }

  .progress-text {
    font-size: 0.85em;
    color: #636e72;
  }

  /* tela final */
  .result-screen {
    display: none;
    text-align: center;
    padding: 30px 10px;
  }
  .result-screen.show { display: block; }
  .result-score {
    font-size: 2.6em;
    font-weight: bold;
    color: #0984e3;
    margin: 6px 0;
  }
  .result-msg {
    font-size: 1em;
    color: #2c3e50;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="quiz-card">

  <div class="quiz-header">
    <h2>🧠 Quiz — Funções e ponteiros em C</h2>
    <span class="quiz-tag" id="quiz-tag">Pergunta 1 de 22</span>
  </div>

  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress-bar-fill"></div>
  </div>

  <div id="question-container"></div>

  <div class="result-screen" id="result-screen">
    <div style="font-size:0.95em; color:#636e72;">Você concluiu o quiz!</div>
    <div class="result-score" id="result-score">0 / 22</div>
    <div class="result-msg" id="result-msg"></div>
    <button class="btn btn-primary" id="restart-btn">Refazer o quiz</button>
  </div>

</div>

<script>
const questions = [
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Criação de funções",
    text: "No código abaixo, por que a linha 3 é necessária?",
    code: `<span class="cmt">/* 1 */</span> #include &lt;stdio.h&gt;
<span class="cmt">/* 2 */</span>
<span class="cmt">/* 3 */</span> <span class="type">double</span> cylinder_volume(<span class="type">double</span> radius, <span class="type">double</span> height);
<span class="cmt">/* 4 */</span>
<span class="cmt">/* 5 */</span> <span class="type">int</span> main(<span class="kw">void</span>) {
<span class="cmt">/* 6 */</span>     printf(<span class="str">"%.2lf\\n"</span>, cylinder_volume(2.0, 5.0));
<span class="cmt">/* 7 */</span>     <span class="kw">return</span> 0;
<span class="cmt">/* 8 */</span> }
<span class="cmt">/* 9 */</span>
<span class="cmt">/* 10 */</span> <span class="type">double</span> cylinder_volume(<span class="type">double</span> radius, <span class="type">double</span> height) { <span class="cmt">/* ... */</span> }`,
    options: [
      "Porque toda função em C precisa ser declarada duas vezes: uma para o compilador e outra para o ligador.",
      "Porque ela reserva memória para os parâmetros radius e height antes de main começar.",
      "Porque a função é usada em main antes de ser definida, e o compilador precisa conhecer antes os tipos dos parâmetros e do retorno.",
      "Porque sem ela a função seria executada antes de main, invertendo a ordem do programa."
    ],
    correctIndex: 2,
    explainCorrect: "Exato. A linha 3 é o protótipo: o cabeçalho da função seguido de ponto-e-vírgula. Ele não gera código nem reserva memória — apenas informa ao compilador a assinatura da função, para que ele consiga verificar a chamada da linha 6 mesmo com a definição só aparecendo na linha 10.",
    explainIncorrect: "A resposta certa é: a função é usada em main antes de ser definida, e o compilador precisa conhecer antes os tipos dos parâmetros e do retorno. Sem o protótipo, a alternativa seria escrever a definição completa acima de main. O protótipo não reserva memória nem altera a ordem de execução."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Criação de funções",
    text: "Qual é a saída do programa abaixo? Note que a função auxiliar aparece no arquivo antes de main.",
    code: `#include &lt;stdio.h&gt;

<span class="kw">void</span> a(<span class="kw">void</span>) {
    printf(<span class="str">"A"</span>);
}

<span class="type">int</span> main(<span class="kw">void</span>) {
    printf(<span class="str">"M"</span>);
    a();
    <span class="kw">return</span> 0;
}`,
    options: ["AM", "MA", "A", "M"],
    correctIndex: 1,
    explainCorrect: "Certo: a saída é MA. A ordem em que as funções são escritas no arquivo não tem relação com a ordem de execução — o programa sempre começa por main. A função a() só executa quando é chamada, depois do printf(\"M\").",
    explainIncorrect: "A resposta certa é MA. Estar escrita antes no arquivo não faz a função a() executar primeiro: a execução sempre se inicia em main, e a() só roda no momento em que é chamada."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Parâmetros e retorno",
    text: "Qual é a saída do programa abaixo? Preste atenção na ordem dos argumentos da chamada.",
    code: `<span class="type">int</span> resto(<span class="type">int</span> a, <span class="type">int</span> b) {
    <span class="kw">return</span> a % b;
}

<span class="type">int</span> main(<span class="kw">void</span>) {
    printf(<span class="str">"%d"</span>, resto(3, 17));
    <span class="kw">return</span> 0;
}`,
    options: ["2", "3", "5", "Erro de compilação: os argumentos estão na ordem errada"],
    correctIndex: 1,
    explainCorrect: "Certo: imprime 3. Os argumentos são associados aos parâmetros por posição, não por intenção: a recebe 3 e b recebe 17. Logo, a função calcula 3 % 17, cujo resto é 3 (pois 3 é menor que 17). Trocar a ordem dos argumentos não é erro de compilação — os tipos casam —, é um bug silencioso.",
    explainIncorrect: "A resposta certa é 3. Como a correspondência é posicional, a = 3 e b = 17, e 3 % 17 vale 3. O valor 2 seria o resultado de 17 % 3, isto é, da chamada com os argumentos na outra ordem."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Parâmetros e retorno",
    text: "Qual é a saída do programa abaixo?",
    code: `<span class="type">int</span> dobro(<span class="type">int</span> x) {
    <span class="kw">return</span> 2 * x;
}

<span class="type">int</span> main(<span class="kw">void</span>) {
    printf(<span class="str">"%d"</span>, dobro(3) + dobro(4));
    <span class="kw">return</span> 0;
}`,
    options: ["14", "7", "24", "Erro: não se pode chamar a mesma função duas vezes na mesma expressão"],
    correctIndex: 0,
    explainCorrect: "Certo: imprime 14. A chamada de uma função com valor de retorno é uma expressão, que ao ser avaliada resulta no valor retornado. Assim, dobro(3) vale 6, dobro(4) vale 8, e a soma das duas é 14 — as chamadas podem compor expressões maiores livremente.",
    explainIncorrect: "A resposta certa é 14. Cada chamada é uma expressão que resulta no valor retornado: dobro(3) = 6 e dobro(4) = 8, logo 6 + 8 = 14. Nada impede chamar a mesma função várias vezes numa mesma expressão; cada chamada é independente."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Escopo de variáveis",
    text: "O que acontece ao compilar e executar o programa abaixo?",
    code: `<span class="type">int</span> main(<span class="kw">void</span>) {
    <span class="type">int</span> i = 0;
    {
        <span class="type">int</span> t = 5;
        i = t;
    }
    printf(<span class="str">"%d %d"</span>, i, t);
    <span class="kw">return</span> 0;
}`,
    options: [
      "Imprime 5 5, pois t continua válida depois do bloco.",
      "Imprime 5 0, pois t é zerada ao sair do bloco.",
      "Compila com aviso e imprime 5 seguido de um valor de lixo.",
      "Não compila: t não existe fora do bloco em que foi declarada."
    ],
    correctIndex: 3,
    explainCorrect: "Certo: o gcc acusa erro (\"'t' undeclared\"). O escopo de uma variável declarada dentro de um bloco é o próprio bloco: fora dele, o nome t simplesmente não existe para o compilador. Note que i, declarada na função, é visível dentro do bloco — a visibilidade vai de fora para dentro, nunca de dentro para fora.",
    explainIncorrect: "A resposta certa é que o programa não compila: t não existe fora do bloco que a declara. Não é aviso nem lixo de memória — é erro de compilação, porque o nome t não está no escopo da linha do printf."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Escopo de variáveis",
    text: "Qual é a saída do programa abaixo? Há duas variáveis chamadas x.",
    code: `<span class="type">int</span> main(<span class="kw">void</span>) {
    <span class="type">int</span> x = 1;
    {
        <span class="type">int</span> x = 2;
        printf(<span class="str">"%d "</span>, x);
    }
    printf(<span class="str">"%d"</span>, x);
    <span class="kw">return</span> 0;
}`,
    options: ["2 1", "1 2", "2 2", "1 1"],
    correctIndex: 0,
    explainCorrect: "Certo: a saída é \"2 1\". São duas variáveis distintas, em espaços de memória diferentes. Dentro do bloco, o x mais interno é o visível, então o primeiro printf mostra 2. Ao sair do bloco, esse x deixa de existir e o x externo — nunca alterado — volta a ser o visível, valendo 1.",
    explainIncorrect: "A resposta certa é \"2 1\". A declaração interna cria uma segunda variável, que apenas oculta a externa enquanto o bloco executa; o x externo continua valendo 1 depois do bloco."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Modelo de pilha",
    text: "Qual é a saída do programa abaixo?",
    code: `<span class="kw">void</span> f(<span class="kw">void</span>) {
    <span class="type">int</span> n = 0;
    n++;
    printf(<span class="str">"%d "</span>, n);
}

<span class="type">int</span> main(<span class="kw">void</span>) {
    f();
    f();
    f();
    <span class="kw">return</span> 0;
}`,
    options: ["1 2 3", "3 3 3", "1 1 1", "0 0 0"],
    correctIndex: 2,
    explainCorrect: "Certo: a saída é \"1 1 1\". n é uma variável automática (local): a cada chamada de f(), um novo espaço é alocado no topo da pilha, inicializado com 0, e liberado quando a função retorna. Nada é preservado de uma chamada para a outra, então n sempre vale 1 no printf.",
    explainIncorrect: "A resposta certa é \"1 1 1\". Cada chamada de f() aloca um n novo na pilha e o inicializa com 0; o valor da chamada anterior já foi descartado. Para acumular entre chamadas seria preciso outro mecanismo, não uma variável local comum."
  },
  {
    difficulty: "avancado",
    diffLabel: "Avançado",
    tag: "Modelo de pilha",
    text: "Qual é o problema com o código abaixo?",
    code: `<span class="type">int</span>* f(<span class="kw">void</span>) {
    <span class="type">int</span> v = 42;
    <span class="kw">return</span> &amp;v;
}

<span class="type">int</span> main(<span class="kw">void</span>) {
    <span class="type">int</span> *p = f();
    printf(<span class="str">"%d"</span>, *p);
    <span class="kw">return</span> 0;
}`,
    options: [
      "Funciona normalmente e imprime 42.",
      "Comportamento indefinido: v deixa de existir quando f() retorna.",
      "Erro obrigatório de compilação.",
      "Imprime o endereço de v, não seu valor."
    ],
    correctIndex: 1,
    explainCorrect: "Certo. v é uma variável automática, alocada na pilha: seu espaço é liberado assim que f() retorna. O endereço devolvido passa a ser um ponteiro pendente (dangling), e pode até \"parecer funcionar\" num teste, mas a memória pode ser reaproveitada por outra chamada a qualquer momento.",
    explainIncorrect: "A resposta certa é que há comportamento indefinido: v existe apenas durante a execução de f(). Ao retornar, sua moldura é desempilhada e o endereço se torna inválido. O programa pode imprimir 42 por sorte, mas isso não é garantido."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Ponteiro de variáveis",
    text: "Qual é a saída do programa abaixo?",
    code: `<span class="type">int</span> main(<span class="kw">void</span>) {
    <span class="type">int</span> a = 5;
    <span class="type">int</span> *p = &amp;a;
    *p = 6;
    printf(<span class="str">"%d"</span>, a);
    <span class="kw">return</span> 0;
}`,
    options: ["5", "Um endereço de memória", "Lixo de memória, pois a nunca é atribuída de novo", "6"],
    correctIndex: 3,
    explainCorrect: "Certo: imprime 6. Como p guarda o endereço de a, acessar *p é equivalente a acessar a. A atribuição *p = 6 escreve no espaço de memória de a — alteração indireta, sem mencionar o nome da variável.",
    explainIncorrect: "A resposta certa é 6. A atribuição *p = 6 não altera p: ela escreve no endereço que p armazena, que é justamente o de a. Por isso a passa a valer 6."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Ponteiro de variáveis",
    text: "O que a variável p armazena após esse trecho de código?",
    code: `<span class="type">int</span> x = 10;
<span class="type">int</span> *p = &amp;x;`,
    options: ["O valor de x (10)", "O endereço de memória de x", "Uma cópia de x", "O valor de p"],
    correctIndex: 1,
    explainCorrect: "Um ponteiro não guarda o valor da variável, guarda o endereço de memória onde ela está armazenada. O operador & retorna justamente esse endereço.",
    explainIncorrect: "A resposta certa é \"o endereço de memória de x\". O operador & não copia o valor de x — ele retorna a posição na memória onde x está guardado, e é isso que p armazena."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Variáveis do tipo ponteiro",
    text: "Na declaração abaixo, quais são os tipos de p e de q?",
    code: `<span class="type">int</span> *p, q;`,
    options: [
      "Ambos são ponteiros para int.",
      "Ambos são variáveis int comuns; o * é apenas decorativo.",
      "p é int e q é ponteiro para int.",
      "p é ponteiro para int e q é um int comum."
    ],
    correctIndex: 3,
    explainCorrect: "Certo. O * pertence ao declarador de cada variável, não ao tipo da linha inteira: só p é ponteiro para int; q é um int comum. Para declarar dois ponteiros, seria preciso repetir o asterisco: int *p, *q;",
    explainIncorrect: "A resposta certa é: p é ponteiro para int e q é um int comum. O asterisco se aplica apenas ao nome que ele precede — declarar dois ponteiros exige int *p, *q;"
  },
  {
    difficulty: "avancado",
    diffLabel: "Avançado",
    tag: "Variáveis do tipo ponteiro",
    text: "O que acontece ao executar o programa abaixo?",
    code: `<span class="type">int</span> main(<span class="kw">void</span>) {
    <span class="type">int</span> a = 2, b, *p;
    *p = 3;
    b = a + (*p);
    printf(<span class="str">"%d"</span>, b);
    <span class="kw">return</span> 0;
}`,
    options: [
      "Imprime 5, pois *p = 3 cria o espaço de memória apontado por p.",
      "Imprime 2, pois *p vale 0 quando p não foi inicializado.",
      "Comportamento indefinido: p não foi inicializado, então *p = 3 escreve num endereço desconhecido.",
      "Erro obrigatório de compilação, pois p não foi inicializado."
    ],
    correctIndex: 2,
    explainCorrect: "Certo. Declarar int *p apenas reserva espaço para guardar um endereço — e esse espaço começa com lixo. A atribuição *p = 3 escreve 3 no endereço que estiver lá por acaso: pode ser memória não usada (e o programa parece funcionar), pode ser o espaço de outra variável, pode derrubar o programa. Só se pode preencher *p depois de p apontar para um espaço válido.",
    explainIncorrect: "A resposta certa é comportamento indefinido: p não foi inicializado, então *p = 3 escreve num endereço desconhecido. O compilador não é obrigado a barrar isso (no máximo emite um aviso), e *p não vale 0 por padrão — a atribuição não cria memória nenhuma."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Passando ponteiros",
    text: "Qual é a saída do programa abaixo?",
    code: `<span class="kw">void</span> f(<span class="type">int</span> n) {
    n = n * 10;
}

let current = 0;
let selectedIndex = null;
let answered = false;
let score = 0;
const userAnswers = new Array(questions.length).fill(null);

const container = document.getElementById('question-container');
const quizTag = document.getElementById('quiz-tag');
const progressFill = document.getElementById('progress-bar-fill');
const resultScreen = document.getElementById('result-screen');
const resultScore = document.getElementById('result-score');
const resultMsg = document.getElementById('result-msg');
const restartBtn = document.getElementById('restart-btn');

function diffClass(d) {
  if (d === 'basico') return 'diff-basico';
  if (d === 'intermediario') return 'diff-intermediario';
  return 'diff-avancado';
}

function renderQuestion() {
  const q = questions[current];
  quizTag.textContent = `Pergunta ${current + 1} de ${questions.length}`;
  progressFill.style.width = `${((current) / questions.length) * 100 + (10)}%`;

  const alreadyAnswered = userAnswers[current] !== null;
  selectedIndex = alreadyAnswered ? userAnswers[current].selected : null;
  answered = alreadyAnswered;

  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if (answered) {
      cls += ' disabled';
      if (i === q.correctIndex) cls += ' correct';
      else if (i === selectedIndex) cls += ' incorrect';
    } else if (i === selectedIndex) {
      cls += ' selected';
    }
    const letter = String.fromCharCode(65 + i);
    return `<li class="${cls}" data-index="${i}">
      <span class="letter">${letter}</span>
      <span>${opt}</span>
    </li>`;
  }).join('');

  let feedbackHtml = '';
  if (answered) {
    const wasCorrect = userAnswers[current].correct;
    feedbackHtml = `<div class="feedback show ${wasCorrect ? 'correct-box' : 'incorrect-box'}">
      <strong class="title">${wasCorrect ? '✅ Correto!' : '❌ Incorreto'}</strong>
      <span class="explain">${wasCorrect ? q.explainCorrect : q.explainIncorrect}</span>
    </div>`;
  }

  container.innerHTML = `
    <div class="question-block">
      <div class="badges">
        <span class="q-label">${q.tag}</span>
        <span class="diff-label ${diffClass(q.difficulty)}">${q.diffLabel}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <pre class="code-block">${q.code}</pre>
      <ul class="options" id="options">${optionsHtml}</ul>
      ${feedbackHtml}
      <div class="actions">
        <span class="progress-text" id="progress-text">${answered ? (userAnswers[current].correct ? 'Resposta correta' : 'Resposta incorreta — veja a explicação') : 'Selecione uma alternativa'}</span>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-secondary" id="prev-btn" ${current === 0 ? 'disabled' : ''}>Anterior</button>
          <button class="btn btn-primary" id="check-btn" ${answered ? 'style="display:none;"' : ''} disabled>Verificar resposta</button>
          <button class="btn btn-primary" id="next-btn" ${answered ? '' : 'style="display:none;"'}>${current === questions.length - 1 ? 'Ver resultado' : 'Próxima pergunta'}</button>
        </div>
      </div>
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  const optionEls = document.querySelectorAll('.option');
  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  const prevBtn = document.getElementById('prev-btn');
  const progressText = document.getElementById('progress-text');

  optionEls.forEach(opt => {
    opt.addEventListener('click', () => {
      if (answered) return;
      optionEls.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedIndex = parseInt(opt.dataset.index, 10);
      checkBtn.disabled = false;
      progressText.textContent = 'Alternativa ' + String.fromCharCode(65 + selectedIndex) + ' selecionada';
    });
  });

  if (checkBtn) {
    checkBtn.addEventListener('click', () => {
      if (selectedIndex === null) return;
      const q = questions[current];
      const isCorrect = selectedIndex === q.correctIndex;
      if (userAnswers[current] === null) {
        if (isCorrect) score++;
      }
      userAnswers[current] = { selected: selectedIndex, correct: isCorrect };
      answered = true;
      renderQuestion();
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (current === questions.length - 1) {
        showResult();
      } else {
        current++;
        renderQuestion();
      }
    });
  }

  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    });
  }
}

function showResult() {
  container.parentElement.querySelector('.progress-bar-track').style.display = 'none';
  container.style.display = 'none';
  quizTag.textContent = 'Concluído';
  resultScreen.classList.add('show');
  resultScore.textContent = `${score} / ${questions.length}`;
  let msg;
  if (score === questions.length) msg = '🎉 Excelente! Você dominou funções, ponteiros, recursão e macros.';
  else if (score >= questions.length * 0.7) msg = '👏 Muito bom! Revise as questões erradas para fixar os detalhes.';
  else if (score >= questions.length * 0.4) msg = '📚 Bom começo — vale revisar escopo, modelo de pilha e passagem por ponteiro.';
  else msg = '🔁 Releia as notas de aula do módulo (funções, ponteiros e macros) e tente novamente.';
  resultMsg.textContent = msg;
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  userAnswers.fill(null);
  resultScreen.classList.remove('show');
  container.style.display = 'block';
  container.parentElement.querySelector('.progress-bar-track').style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
