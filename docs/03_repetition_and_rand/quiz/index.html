<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Repetição e Números Aleatórios</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 30px 15px;
  }

  .quiz-card {
    width: 80%;
    max-width: 800px;
    margin: 0 auto;
    background-color: #ffffff;
    border: 1px solid #0984e3;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(9, 132, 227, 0.08);
    padding: 30px;
    line-height: 1.6;
    color: #333;
  }

  .quiz-header {
    border-bottom: 2px solid #0984e3;
    padding-bottom: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-header h2 {
    color: #2c3e50;
    margin: 0;
    font-size: 1.25em;
  }

  .quiz-tag {
    background-color: #0984e3;
    color: white;
    padding: 5px 12px;
    font-size: 0.85em;
    font-weight: bold;
    border-radius: 20px;
    white-space: nowrap;
  }

  .progress-bar-track {
    width: 100%;
    height: 6px;
    background-color: #eef2f5;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar-fill {
    height: 100%;
    background-color: #0984e3;
    width: 5%;
    transition: width 0.25s ease;
  }

  .question-block {
    background-color: #fdfdfd;
    border: 1px solid #e0e0e0;
    border-left: 5px solid #0984e3;
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 20px;
    transition: border-left-color 0.2s ease;
  }

  .badges {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .q-label {
    display: inline-block;
    background: #0984e3;
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.75em;
  }

  .diff-label {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75em;
    font-weight: bold;
  }
  .diff-basico        { background: #d4efdf; color: #1e8449; }
  .diff-intermediario { background: #fdebd0; color: #b9770e; }
  .diff-avancado      { background: #fadbd8; color: #a93226; }

  .q-text {
    font-size: 1em;
    color: #2c3e50;
    margin: 6px 0 14px 0;
  }

  pre.code-block {
    background-color: #2d3436;
    color: #dfe6e9;
    padding: 14px 16px;
    border-radius: 6px;
    font-family: 'Fira Code', Consolas, Monaco, monospace;
    font-size: 0.9em;
    overflow-x: auto;
    margin: 10px 0 4px 0;
  }
  pre.code-block .kw   { color: #74b9ff; }
  pre.code-block .type { color: #55efc4; }
  pre.code-block .str  { color: #ffeaa7; }
  pre.code-block .cmt  { color: #95a5a6; font-style: italic; }

  .options {
    list-style: none;
    padding: 0;
    margin: 16px 0 0 0;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
    border: 1px solid #dcdde1;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95em;
    color: #2c3e50;
    background-color: #fff;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .option:hover {
    border-color: #0984e3;
    background-color: #f0f8ff;
  }

  .option.selected {
    border-color: #0984e3;
    background-color: #eaf4fd;
  }

  .option .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 50%;
    border: 1px solid #b2bec3;
    font-size: 0.8em;
    font-weight: bold;
    color: #636e72;
  }

  .option.selected .letter {
    border-color: #0984e3;
    background-color: #0984e3;
    color: #fff;
  }

  .option.correct {
    border-color: #00b894;
    background-color: #e8f8f5;
  }
  .option.correct .letter {
    border-color: #00b894;
    background-color: #00b894;
    color: #fff;
  }

  .option.incorrect {
    border-color: #d63031;
    background-color: #fdecea;
  }
  .option.incorrect .letter {
    border-color: #d63031;
    background-color: #d63031;
    color: #fff;
  }

  .option.disabled {
    cursor: default;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .btn-primary {
    background-color: #0984e3;
    color: #fff;
  }
  .btn-primary:disabled {
    background-color: #b2cdf0;
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: #f1f2f6;
    color: #2c3e50;
    border: 1px solid #dcdde1;
  }
  .btn-secondary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .feedback {
    display: none;
    margin-top: 18px;
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 0.92em;
  }

  .feedback.show { display: block; }

  .feedback.correct-box {
    background-color: #e8f8f5;
    border: 1px solid #a3e4d7;
    color: #117a65;
  }

  .feedback.incorrect-box {
    background-color: #fdecea;
    border: 1px solid #f5b7b1;
    color: #922b21;
  }

  .feedback strong.title {
    display: block;
    margin-bottom: 6px;
    font-size: 1.02em;
  }

  .feedback .explain {
    color: #2c3e50;
  }

  .progress-text {
    font-size: 0.85em;
    color: #636e72;
  }

  .result-screen {
    display: none;
    text-align: center;
    padding: 30px 10px;
  }
  .result-screen.show { display: block; }
  .result-score {
    font-size: 2.6em;
    font-weight: bold;
    color: #0984e3;
    margin: 6px 0;
  }
  .result-msg {
    font-size: 1em;
    color: #2c3e50;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="quiz-card">

  <div class="quiz-header">
    <h2>🔁 Quiz — Repetição e Números Aleatórios</h2>
    <span class="quiz-tag" id="quiz-tag">Pergunta 1 de 10</span>
  </div>

  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress-bar-fill"></div>
  </div>

  <div id="question-container"></div>

  <div class="result-screen" id="result-screen">
    <div style="font-size:0.95em; color:#636e72;">Você concluiu o quiz de repetição e aleatórios!</div>
    <div class="result-score" id="result-score">0 / 10</div>
    <div class="result-msg" id="result-msg"></div>
    <button class="btn btn-primary" id="restart-btn">Refazer o quiz</button>
  </div>

</div>

<script>
const questions = [
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Laço for — mecânica",
    text: "Quantas vezes o comando dentro do laço abaixo é executado?",
    code: `<span class="type">int</span> i;
<span class="kw">for</span> (i = 0; i &lt; 5; i++) {
    <span class="cmt">// corpo</span>
}`,
    options: ["4", "5", "6", "Infinitas vezes"],
    correctIndex: 1,
    explainCorrect: "i assume os valores 0, 1, 2, 3, 4 — cinco valores que satisfazem i < 5 antes do laço parar.",
    explainIncorrect: "A resposta correta é 5. O laço testa i < 5 antes de cada execução; i vai de 0 até 4, totalizando 5 repetições."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "while vs do-while",
    text: "Qual é a saída dos dois trechos abaixo, considerando as variáveis já inicializadas com 10?",
    code: `<span class="kw">while</span> (x &lt; 5) {
    printf(<span class="str">"A"</span>);
}

<span class="kw">do</span> {
    printf(<span class="str">"B"</span>);
} <span class="kw">while</span> (y &lt; 5);`,
    options: ["Não imprime nada / Imprime 'B' uma vez", "Imprime 'A' uma vez / Não imprime nada", "Ambos imprimem uma vez", "Ambos entram em loop infinito"],
    correctIndex: 0,
    explainCorrect: "No while, a condição é testada antes: como 10 < 5 é falso, o corpo nunca executa. No do-while, o corpo executa uma vez antes de testar a condição, por isso 'B' é impresso mesmo com a condição falsa.",
    explainIncorrect: "A resposta correta é a primeira opção. while testa a condição antes (não executa nada), enquanto do-while executa o corpo pelo menos uma vez antes de testar."
  },
  {
    difficulty: "basico",
    diffLabel: "Básico",
    tag: "Intervalo com rand()",
    text: "Qual expressão gera um número aleatório entre 1 e 6 (simulando um dado), como no exemplo dice.c?",
    code: `<span class="type">int</span> resultado = rand() % 6 + 1;`,
    options: ["rand() % 6", "rand() % 6 + 1", "rand() % 7", "rand() / 6 + 1"],
    correctIndex: 1,
    explainCorrect: "rand() % 6 produz valores de 0 a 5. Somando 1, o intervalo se desloca para 1 a 6.",
    explainIncorrect: "A resposta correta é 'rand() % 6 + 1'. O operador % limita o resultado a 0..5, e o +1 desloca a faixa para 1..6."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "srand e sementes",
    text: "No exemplo rand.c, a chamada srand(10) é usada em vez de srand(time(NULL)). Qual o efeito prático disso?",
    code: `srand(10);
printf(<span class="str">"%d\\n"</span>, rand());`,
    options: ["A cada execução, um número diferente é gerado", "A sequência de números gerados é sempre a mesma entre execuções", "O programa gera apenas números pares", "srand(10) desativa o gerador aleatório"],
    correctIndex: 1,
    explainCorrect: "Uma semente fixa (srand(10)) faz o gerador pseudoaleatório produzir sempre a mesma sequência de números — útil para depuração e resultados reprodutíveis.",
    explainIncorrect: "A resposta correta é: a sequência é sempre a mesma. Como a semente é fixa, o algoritmo pseudoaleatório reproduz exatamente a mesma sequência de valores a cada execução."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "srand(time(NULL))",
    text: "Por que os exemplos dice.c e guess_the_number.c usam srand(time(NULL)) em vez de uma semente fixa?",
    code: `srand(time(<span class="kw">NULL</span>));
<span class="type">int</span> n = rand() % 100 + 1;`,
    options: ["Porque time(NULL) é mais rápido de calcular", "Para que a sequência de números aleatórios mude a cada execução do programa", "Porque rand() não funciona sem srand(time(NULL))", "Para evitar erros de compilação"],
    correctIndex: 1,
    explainCorrect: "time(NULL) retorna o instante atual (em segundos), que muda a cada execução, garantindo sementes diferentes e, portanto, sequências diferentes — essencial para jogos onde cada partida deve ser distinta.",
    explainIncorrect: "A resposta correta é: para que a sequência mude a cada execução. Usar o tempo atual como semente evita repetir sempre os mesmos números 'aleatórios'."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Laço controlado por condição (while(1) + break)",
    text: "No jogo 'Adivinhe o número', o laço principal é escrito como while (1) { ... }. Como o programa evita rodar para sempre?",
    code: `<span class="kw">while</span> (1) {
    scanf(<span class="str">"%d"</span>, &amp;user_guess);
    <span class="kw">if</span> (user_guess == number_to_guess) {
        printf(<span class="str">"Acertou!\\n"</span>);
        <span class="kw">break</span>;
    }
}`,
    options: ["O compilador limita automaticamente o número de repetições", "O comando break interrompe o laço quando a condição de acerto é satisfeita", "while(1) já para sozinho após algumas iterações", "É necessário um contador externo para parar o laço"],
    correctIndex: 1,
    explainCorrect: "while (1) cria um laço com condição sempre verdadeira; é o break dentro do if que interrompe explicitamente a repetição assim que o usuário acerta o número.",
    explainIncorrect: "A resposta correta é: o break interrompe o laço. Sem ele, while(1) rodaria para sempre — é o break que dá a condição de parada real ao programa."
  },
  {
    difficulty: "intermediario",
    diffLabel: "Intermediário",
    tag: "Laços com sinais diferentes",
    text: "No exemplo power.c, por que existem dois laços for distintos — um para exponent >= 0 e outro para exponent negativo?",
    code: `<span class="kw">if</span> (exponent &gt;= 0)
    <span class="kw">for</span> (<span class="type">int</span> i = 0; i &lt; exponent; ++i)
        result *= base;
<span class="kw">else</span>
    <span class="kw">for</span> (<span class="type">int</span> i = 0; i &lt; -exponent; ++i)
        result /= base;`,
    options: ["Por estilo de código, sem diferença real de comportamento", "Porque expoente negativo significa divisões sucessivas, enquanto expoente positivo significa multiplicações sucessivas", "Porque o C não permite for com variável negativa em nenhuma situação", "Porque um dos laços é mais rápido que o outro"],
    correctIndex: 1,
    explainCorrect: "Elevar a um expoente negativo equivale a dividir sucessivamente pela base (base⁻ⁿ = 1/baseⁿ). O código trata os dois casos com laços separados: multiplicação para expoente positivo e divisão para expoente negativo.",
    explainIncorrect: "A resposta correta é a segunda opção. Expoente negativo corresponde a divisões repetidas, enquanto expoente positivo corresponde a multiplicações repetidas — por isso a lógica se divide em dois laços."
  },
  {
    difficulty: "avancado",
    diffLabel: "Avançado",
    tag: "break vs continue",
    text: "Qual é a saída do trecho abaixo?",
    code: `<span class="kw">for</span> (<span class="type">int</span> i = 1; i &lt;= 5; i++) {
    <span class="kw">if</span> (i == 3) <span class="kw">continue</span>;
    <span class="kw">if</span> (i == 5) <span class="kw">break</span>;
    printf(<span class="str">"%d "</span>, i);
}`,
    options: ["1 2 3 4", "1 2 4", "1 2 4 5", "1 2 3 4 5"],
    correctIndex: 1,
    explainCorrect: "continue pula apenas a iteração atual (i == 3, não imprime e vai para a próxima); break encerra o laço completamente quando i == 5, antes de imprimir. Resultado: 1 2 4.",
    explainIncorrect: "A resposta correta é '1 2 4'. Quando i vale 3, continue pula o printf e passa para i=4 (que é impresso); quando i vale 5, break interrompe o laço antes do printf."
  },
  {
    difficulty: "avancado",
    diffLabel: "Avançado",
    tag: "Fatorial — caso de borda",
    text: "No exemplo factorial.c, qual é a saída para a entrada n = 0?",
    code: `<span class="type">int</span> factorial = 1;
<span class="kw">for</span> (<span class="type">int</span> i = 1; i &lt;= n; ++i) {
    factorial *= i;
}
printf(<span class="str">"Factorial of %d is %d\\n"</span>, n, factorial);`,
    options: ["Factorial of 0 is 0", "Factorial of 0 is 1", "O laço nunca termina", "Erro de execução"],
    correctIndex: 1,
    explainCorrect: "Com n = 0, a condição i <= n (1 <= 0) é falsa desde a primeira verificação, então o corpo do laço nunca executa. factorial permanece com seu valor inicial, 1 — que é matematicamente o valor correto de 0!.",
    explainIncorrect: "A resposta correta é 'Factorial of 0 is 1'. Como 1 <= 0 é falso, o laço for não executa nenhuma vez e factorial mantém o valor inicial 1, que é o resultado correto de 0!."
  },
  {
    difficulty: "avancado",
    diffLabel: "Avançado",
    tag: "Buffer de entrada e getchar()",
    text: "No exemplo dice.c, o programa usa getchar() para esperar o Enter do usuário antes de rolar o dado. Qual cuidado é importante ao misturar scanf com getchar()?",
    code: `printf(<span class="str">"Press Enter to roll the dice..."</span>);
getchar();`,
    options: ["Nenhum — getchar() e scanf nunca interferem entre si", "Um scanf anterior pode deixar o caractere de quebra de linha ('\\n') no buffer, fazendo getchar() retornar imediatamente sem esperar um novo Enter", "getchar() sempre trava o programa esperando input do teclado, mesmo com buffer pendente", "getchar() só funciona se for chamado antes de qualquer scanf no programa"],
    correctIndex: 1,
    explainCorrect: "Se um scanf anterior deixou um '\\n' pendente no buffer de entrada, o getchar() seguinte consome esse '\\n' residual em vez de esperar uma nova tecla — por isso a ordem e o cuidado com o buffer importam ao combinar as duas funções.",
    explainIncorrect: "A resposta correta é a segunda opção. getchar() lê o próximo caractere disponível no buffer; se sobrou um '\\n' de um scanf anterior, ele é consumido imediatamente, sem pausar de fato o programa."
  }
];

let current = 0;
let selectedIndex = null;
let answered = false;
let score = 0;
const userAnswers = new Array(questions.length).fill(null);

const container = document.getElementById('question-container');
const quizTag = document.getElementById('quiz-tag');
const progressFill = document.getElementById('progress-bar-fill');
const resultScreen = document.getElementById('result-screen');
const resultScore = document.getElementById('result-score');
const resultMsg = document.getElementById('result-msg');
const restartBtn = document.getElementById('restart-btn');

function diffClass(d) {
  if (d === 'basico') return 'diff-basico';
  if (d === 'intermediario') return 'diff-intermediario';
  return 'diff-avancado';
}

function renderQuestion() {
  const q = questions[current];
  quizTag.textContent = `Pergunta ${current + 1} de ${questions.length}`;
  progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;

  const alreadyAnswered = userAnswers[current] !== null;
  selectedIndex = alreadyAnswered ? userAnswers[current].selected : null;
  answered = alreadyAnswered;

  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if (answered) {
      cls += ' disabled';
      if (i === q.correctIndex) cls += ' correct';
      else if (i === selectedIndex) cls += ' incorrect';
    } else if (i === selectedIndex) {
      cls += ' selected';
    }
    const letter = String.fromCharCode(65 + i);
    return `<li class="${cls}" data-index="${i}">
      <span class="letter">${letter}</span>
      <span>${opt}</span>
    </li>`;
  }).join('');

  let feedbackHtml = '';
  if (answered) {
    const wasCorrect = userAnswers[current].correct;
    feedbackHtml = `<div class="feedback show ${wasCorrect ? 'correct-box' : 'incorrect-box'}">
      <strong class="title">${wasCorrect ? '✅ Correto!' : '❌ Incorreto'}</strong>
      <span class="explain">${wasCorrect ? q.explainCorrect : q.explainIncorrect}</span>
    </div>`;
  }

  container.innerHTML = `
    <div class="question-block">
      <div class="badges">
        <span class="q-label">${q.tag}</span>
        <span class="diff-label ${diffClass(q.difficulty)}">${q.diffLabel}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <pre class="code-block">${q.code}</pre>
      <ul class="options" id="options">${optionsHtml}</ul>
      ${feedbackHtml}
      <div class="actions">
        <span class="progress-text" id="progress-text">${answered ? (userAnswers[current].correct ? 'Resposta correta' : 'Resposta incorreta — veja a explicação') : 'Selecione uma alternativa'}</span>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-secondary" id="prev-btn" ${current === 0 ? 'disabled' : ''}>Anterior</button>
          <button class="btn btn-primary" id="check-btn" ${answered ? 'style="display:none;"' : ''} disabled>Verificar resposta</button>
          <button class="btn btn-primary" id="next-btn" ${answered ? '' : 'style="display:none;"'}>${current === questions.length - 1 ? 'Ver resultado' : 'Próxima pergunta'}</button>
        </div>
      </div>
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  const optionEls = document.querySelectorAll('.option');
  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  const prevBtn = document.getElementById('prev-btn');
  const progressText = document.getElementById('progress-text');

  optionEls.forEach(opt => {
    opt.addEventListener('click', () => {
      if (answered) return;
      optionEls.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedIndex = parseInt(opt.dataset.index, 10);
      checkBtn.disabled = false;
      progressText.textContent = 'Alternativa ' + String.fromCharCode(65 + selectedIndex) + ' selecionada';
    });
  });

  if (checkBtn) {
    checkBtn.addEventListener('click', () => {
      if (selectedIndex === null) return;
      const q = questions[current];
      const isCorrect = selectedIndex === q.correctIndex;
      if (userAnswers[current] === null) {
        if (isCorrect) score++;
      }
      userAnswers[current] = { selected: selectedIndex, correct: isCorrect };
      answered = true;
      renderQuestion();
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (current === questions.length - 1) {
        showResult();
      } else {
        current++;
        renderQuestion();
      }
    });
  }

  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    });
  }
}

function showResult() {
  container.parentElement.querySelector('.progress-bar-track').style.display = 'none';
  container.style.display = 'none';
  quizTag.textContent = 'Concluído';
  resultScreen.classList.add('show');
  resultScore.textContent = `${score} / ${questions.length}`;
  let msg;
  if (score === questions.length) msg = '🎉 Excelente! Você dominou os laços de repetição e a geração de números aleatórios.';
  else if (score >= questions.length * 0.7) msg = '👏 Muito bom! Revise as questões que errou para fixar break/continue e o uso de rand()/srand().';
  else if (score >= questions.length * 0.4) msg = '📚 Bom começo — vale a pena revisar a diferença entre while, do-while e for.';
  else msg = '🔁 Releia o material do módulo e tente novamente para reforçar os laços de repetição.';
  resultMsg.textContent = msg;
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  userAnswers.fill(null);
  resultScreen.classList.remove('show');
  container.style.display = 'block';
  container.parentElement.querySelector('.progress-bar-track').style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
